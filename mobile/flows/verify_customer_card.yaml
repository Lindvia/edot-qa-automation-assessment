# MOB-04: the customer card in the list shows exactly the data that was entered (Tier 2).
# The customer is saved on the device first, so this flow must NOT clear the app state: it reuses the
# session left by create_customer.yaml. (The app has no customer detail screen: cards are not tappable.)
appId: ${APP_ID}
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "rv_main_menu"
    timeout: 30000
- tapOn: "New Customer"
- extendedWaitUntil:
    visible:
      id: "rvNooCustomer"
    timeout: 30000
- runFlow: shared/find_customer_card.yaml
# One assertion per field, so a failure names the field. Each one selects THE CARD (the element whose
# direct child is this outlet's name) and requires the field INSIDE it: another card on screen that
# also says "Waiting for Approval" or "Retailer Small" cannot satisfy it (proved on a device: a wrong
# status fails even with such neighbours visible).
- assertVisible:
    id: "tv_name"
    text: ${OUTLET_NAME}
- assertVisible:
    containsChild:
      id: "tv_name"
      text: ${OUTLET_NAME}
    containsDescendants:
      - id: "tv_address"
        text: ${STREET_ADDRESS}
- assertVisible:
    containsChild:
      id: "tv_name"
      text: ${OUTLET_NAME}
    containsDescendants:
      - id: "tv_first_customer_group"
        text: ${CUSTOMER_TYPE}
- assertVisible:
    containsChild:
      id: "tv_name"
      text: ${OUTLET_NAME}
    containsDescendants:
      - id: "tv_status"
        text: "Waiting for Approval"
- assertVisible:
    containsChild:
      id: "tv_name"
      text: ${OUTLET_NAME}
    containsDescendants:
      - id: "tv_reg_number"
        text: "CUST-[0-9]+"
