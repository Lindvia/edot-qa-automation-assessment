# MOB-02: a wrong password is rejected with the specific error dialog (Negative).
# The wrapper passes a deliberately wrong PASSWORD for this flow.
appId: ${APP_ID}
---
- runFlow: shared/login.yaml
# Specific message captured from the app: title "Oops", text "Wrong login combination", button "OK".
- assertVisible: "Oops"
- assertVisible: "Wrong login combination"
- assertVisible: "OK"
- assertNotVisible:
    id: "rv_main_menu"
