name: tests

# Unit tests (offline) run on every push and pull request.
# The web suite creates and deletes a company on the shared eSuite, so it runs ONLY when started by
# hand (Actions > tests > Run workflow), never on a push.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_web:
        description: "Also run the web suite against eSuite (creates and deletes one test company)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/unit -q

  web:
    if: github.event_name == 'workflow_dispatch' && inputs.run_web
    needs: unit
    runs-on: ubuntu-latest
    # one run at a time: two runs would create companies on the same shared environment together
    concurrency: esuite-shared-environment
    env:
      HEADLESS: "true"
      ESUITE_EMAIL: ${{ secrets.ESUITE_EMAIL }}
      ESUITE_PASSWORD: ${{ secrets.ESUITE_PASSWORD }}
      # optional: without them the test data falls back to Faker
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Web suite
        run: python -m pytest web/tests --clean-alluredir
      - name: Install Allure (needs Java, preinstalled on the runner)
        if: always()
        run: npm install -g allure-commandline
      - name: Build the Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report
      - name: Publish the Allure report and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-web-report
          path: |
            allure-report
            allure-results
          retention-days: 30
