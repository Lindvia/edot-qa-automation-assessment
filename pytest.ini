[pytest]
testpaths = tests/unit web/tests
pythonpath = .
addopts = -ra --alluredir=allure-results -m "not demo"
# Allure results accumulate across runs. For a clean report run with: --clean-alluredir

markers =
    smoke: fast run-first checks (login reaches the dashboard)
    tier1: navigation / display assertions only
    tier2: creates, edits or deletes data and asserts the data itself
    negative: asserts a specific error / blocked state
    skip_ci: runs locally, excluded from CI with -m "not skip_ci"
    mobile: Maestro flows on a real device / emulator (run explicitly: pytest mobile/tests)
    demo: deliberately failing tests that feed the triage demo (excluded unless -m demo)
